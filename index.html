<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Project Apex | Hypertrophy Protocol</title>
    
    <!-- PWA / Add to Home Screen -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="Jarvis%20icon.webp" type="image/webp">
    <link rel="apple-touch-icon" href="Jarvis%20icon.webp">
    <meta name="apple-mobile-web-app-title" content="Jarvis Workout">
    <meta name="application-name" content="Jarvis Workout">
    <meta name="theme-color" content="#050101">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        iron: {
                            red: { 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 900: '#7f1d1d', 950: '#450a0a' },
                            gold: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04' },
                            cyan: { 400: '#22d3ee', 500: '#06b6d4', 900: '#164e63' }
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'shimmer': 'shimmer 3s linear infinite',
                        'fadeIn': 'fadeIn 0.5s ease-out forwards',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '200% center' },
                            '100%': { backgroundPosition: '-200% center' }
                        },
                        fadeIn: {
                            'from': { opacity: '0', transform: 'translateY(15px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- React & ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX compilation in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root { color-scheme: dark; }
        html { scroll-behavior: smooth; font-size: 16px; }
        body { 
            background-color: #050101; /* OLED deep black/red */
            overscroll-behavior: none; 
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom Scrollbar for desktop */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #450a0a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #dc2626; }
        
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .scanline {
            width: 100%;
            height: 100px;
            background: linear-gradient(0deg, rgba(6,182,212,0) 0%, rgba(6,182,212,0.2) 50%, rgba(6,182,212,0) 100%);
            opacity: 0.15;
            position: absolute;
            top: -100px;
            animation: scanline 8s linear infinite;
            pointer-events: none;
            z-index: 40;
        }
        @keyframes scanline {
            0% { top: -100px; }
            100% { top: 100%; }
        }

        .grid-bg {
            background-image: 
                linear-gradient(rgba(220, 38, 38, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(220, 38, 38, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        /* Noise texture for depth */
        .noise-bg {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.04;
            pointer-events: none;
            z-index: 50;
        }

        /* Hide number input spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>
    <!-- Root element for React to attach to -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Data Definition
        const workoutData = [
            {
                id: '01',
                day: 'Monday',
                title: 'Chest Destruction',
                theme: 'from-iron-red-600/30 to-iron-red-900/10',
                textAccent: 'text-iron-red-500',
                borderAccent: 'border-iron-red-500/30',
                exercises: [
                    { name: 'Barbell Bench Press (Flat)', sets: '4', reps: '8-10', rest: '60s' },
                    { name: 'Incline Dumbbell Press', sets: '4', reps: '8-10', rest: '60s' },
                    { name: 'Decline Cable Crossovers', sets: '4', reps: '10-12', rest: '45s' },
                    { name: 'Incline Dumbbell Flyes', sets: '3', reps: '12-15', rest: '45s' },
                    { name: 'Machine Chest Press (Burnout)', sets: '2', reps: 'Failure', rest: '45s' },
                ]
            },
            {
                id: '02',
                day: 'Tuesday',
                title: 'Back Annihilation',
                theme: 'from-orange-600/30 to-amber-900/10',
                textAccent: 'text-orange-500',
                borderAccent: 'border-orange-500/30',
                exercises: [
                    { name: 'Barbell Deadlift', sets: '4', reps: '6-8', rest: '90s' },
                    { name: 'Wide-Grip Lat Pulldown', sets: '4', reps: '8-10', rest: '60s' },
                    { name: 'Bent-Over Barbell Rows', sets: '4', reps: '8-10', rest: '60s' },
                    { name: 'Close-Grip Seated Cable Row', sets: '3', reps: '10-12', rest: '45s' },
                    { name: 'Straight-Arm Pulldowns', sets: '3', reps: '12-15', rest: '45s' },
                ]
            },
            {
                id: '03',
                day: 'Wednesday',
                title: 'Leg Demolition',
                theme: 'from-emerald-600/30 to-teal-900/10',
                textAccent: 'text-emerald-500',
                borderAccent: 'border-emerald-500/30',
                exercises: [
                    { name: 'Barbell Back Squat', sets: '4', reps: '8-10', rest: '90s' },
                    { name: 'Leg Press', sets: '4', reps: '10-12', rest: '60s' },
                    { name: 'Bulgarian Split Squats (DB)', sets: '3/leg', reps: '10-12', rest: '45s' },
                    { name: 'Lying Leg Curls (Hamstrings)', sets: '4', reps: '12-15', rest: '45s' },
                    { name: 'Standing Calf Raises', sets: '4', reps: '15-20', rest: '45s' },
                ]
            },
            {
                id: '04',
                day: 'Thursday',
                title: 'Shoulder Obliteration',
                theme: 'from-violet-600/30 to-purple-900/10',
                textAccent: 'text-violet-500',
                borderAccent: 'border-violet-500/30',
                exercises: [
                    { name: 'Seated Overhead Press (DB)', sets: '4', reps: '8-10', rest: '60s' },
                    { name: 'Lateral Raises (Dumbbell)', sets: '4', reps: '12-15', rest: '45s' },
                    { name: 'Reverse Pec Deck (Rear Delts)', sets: '4', reps: '12-15', rest: '45s' },
                    { name: 'Cable Upright Rows', sets: '3', reps: '10-12', rest: '45s' },
                    { name: 'Front Plate Raises', sets: '3', reps: '12-15', rest: '45s' },
                ]
            },
            {
                id: '05',
                day: 'Friday',
                title: 'Arm & Core Extremity',
                theme: 'from-cyan-600/30 to-blue-900/10',
                textAccent: 'text-cyan-500',
                borderAccent: 'border-cyan-500/30',
                exercises: [
                    { name: 'Barbell Bicep Curls', sets: '4', reps: '8-10', rest: '60s' },
                    { name: 'EZ Bar Skull Crushers', sets: '4', reps: '8-10', rest: '60s' },
                    { name: 'Hammer Curls (Dumbbell)', sets: '3', reps: '10-12', rest: '45s' },
                    { name: 'Triceps Rope Pushdowns', sets: '3', reps: '12-15', rest: '45s' },
                    { name: 'Hanging Leg Raises', sets: '4', reps: '15-20', rest: '45s' },
                    { name: 'Weighted Cable Crunches', sets: '4', reps: '15-20', rest: '45s' },
                ]
            }
        ];

        // Icon wrapper for Lucide icons (since we load them via CDN script, not NPM)
        const Icon = ({ name, className = "" }) => {
            const iconRef = useRef(null);
            
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = '';
                    lucide.createIcons({
                        icons: { [name]: window.lucide.icons[name] },
                        nameAttr: 'data-lucide',
                        attrs: { class: className, 'stroke-width': 2 }
                    });
                    
                    // Manually append the created icon
                    const svg = document.createElement('i');
                    svg.setAttribute('data-lucide', name);
                    svg.setAttribute('class', className);
                    iconRef.current.appendChild(svg);
                    
                    lucide.createIcons({ root: iconRef.current });
                }
            }, [name, className]);

            return <span ref={iconRef} className="inline-flex items-center justify-center"></span>;
        };

        const ScrollReveal = ({ children, delay = 0, className = "" }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1, rootMargin: '0px 0px -50px 0px' }
                );
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div
                    ref={ref}
                    className={`transition-all duration-1000 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                        isVisible ? 'opacity-100 translate-y-0 scale-100' : 'opacity-0 translate-y-12 scale-[0.95]'
                    } ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        const ExerciseRow = ({ dayId, exercise, index, initialWeight, onSaveWeight, colorAccent, completedSets, onSetComplete }) => {
            const [weight, setWeight] = useState(initialWeight || '');
            const [isFocused, setIsFocused] = useState(false);
            const [showSaved, setShowSaved] = useState(false);
            const inputRef = useRef(null);

            const handleBlur = () => {
                setIsFocused(false);
                if (weight !== initialWeight) {
                    onSaveWeight(dayId, index, weight);
                    setShowSaved(true);
                    setTimeout(() => setShowSaved(false), 2000);
                }
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    inputRef.current?.blur();
                }
            };

            return (
                <div className={`group relative w-full mb-4 md:mb-6 rounded-[24px] md:rounded-[32px] overflow-hidden transition-all duration-500 ease-out
                    ${isFocused ? 'scale-[1.02] shadow-2xl z-10' : 'hover:scale-[1.01] hover:shadow-xl z-0'}
                `}>
                    {/* Deep Neuromorphic/Glass Background */}
                    <div className={`absolute inset-0 transition-colors duration-500
                        ${isFocused ? 'bg-[#151515] border-white/20' : 'bg-[#0a0a0a] border-white/5'}
                        border
                    `} />

                    {/* Content Container */}
                    <div className="relative z-10 flex flex-col xl:flex-row xl:items-center p-5 md:p-8 gap-6 md:gap-8">
                        
                        {/* Header Section (Index + Name) */}
                        <div className="flex-1 flex items-start gap-5">
                            <div className={`w-12 h-12 md:w-14 md:h-14 rounded-full flex items-center justify-center border transition-colors duration-500 shrink-0
                                ${isFocused ? `bg-white/10 ${colorAccent.replace('text-', 'border-')}` : 'bg-white/5 border-white/10 group-hover:border-white/20'}
                            `}>
                                <span className={`font-mono text-lg md:text-xl font-bold ${isFocused ? 'text-white' : 'text-white/50'}`}>
                                    {String(index + 1).padStart(2, '0')}
                                </span>
                            </div>
                            <div className="pt-1 md:pt-2">
                                <h5 className="text-white text-xl md:text-2xl font-semibold tracking-tight leading-tight group-hover:text-white transition-colors duration-300">
                                    {exercise.name}
                                </h5>
                            </div>
                        </div>

                        {/* Metrics Grid (Sets, Reps, Rest) */}
                        <div className="flex justify-between sm:justify-start gap-4 md:gap-8 shrink-0 py-4 xl:py-0 border-y xl:border-y-0 border-white/5 xl:px-8 w-full xl:w-auto">
                            <div className="flex flex-col gap-1 w-16">
                                <span className="text-[10px] md:text-xs text-white/40 uppercase tracking-widest font-mono">Sets</span>
                                <span className="text-white font-mono text-xl md:text-2xl font-medium">{exercise.sets}</span>
                            </div>
                            <div className="flex flex-col gap-1 w-20">
                                <span className="text-[10px] md:text-xs text-white/40 uppercase tracking-widest font-mono">Reps</span>
                                <span className="text-white font-mono text-xl md:text-2xl font-medium">{exercise.reps}</span>
                            </div>
                            <div className="flex flex-col gap-1 w-16">
                                <span className="text-[10px] md:text-xs text-white/40 uppercase tracking-widest font-mono">Rest</span>
                                <span className={`font-mono text-xl md:text-2xl font-bold ${
                                    exercise.rest === '45s' ? 'text-iron-red-500' : 
                                    exercise.rest === '60s' ? 'text-iron-gold-500' : 'text-emerald-500'
                                }`}>
                                    {exercise.rest}
                                </span>
                            </div>
                        </div>

                        {/* Input Section (Deep 3D Inner Shadow) */}
                        <div className="w-full xl:w-64 shrink-0 relative flex flex-col justify-end">
                            <div className="flex justify-between items-end mb-2 h-5">
                                <span className="text-[10px] md:text-xs text-white/40 uppercase tracking-widest font-mono">Load (Lbs/Kg)</span>
                                <div className={`transition-all duration-300 flex items-center gap-1.5 text-xs font-mono uppercase ${showSaved ? 'opacity-100 text-emerald-400 translate-y-0' : 'opacity-0 translate-y-2'}`}>
                                    <Icon name="checkCircle2" className="w-3 h-3" /> Saved
                                </div>
                            </div>
                            
                            <div className="relative group/input">
                                {/* Inner Shadow Container mimicking Pixel hardware depth */}
                                <div className={`absolute inset-0 rounded-[16px] md:rounded-[20px] pointer-events-none transition-all duration-300
                                    shadow-[inset_0_4px_24px_rgba(0,0,0,0.8),inset_0_2px_4px_rgba(0,0,0,0.4)]
                                    ${isFocused ? 'ring-1 ring-white/20 bg-black/60' : 'bg-[#030303] group-hover/input:bg-[#050505]'}
                                `} />
                                
                                <input
                                    ref={inputRef}
                                    type="text"
                                    inputMode="decimal"
                                    placeholder="---"
                                    value={weight}
                                    onChange={(e) => setWeight(e.target.value)}
                                    onFocus={() => setIsFocused(true)}
                                    onBlur={handleBlur}
                                    onKeyDown={handleKeyDown}
                                    className="relative w-full bg-transparent text-white font-mono text-2xl md:text-3xl px-6 py-4 md:py-5 rounded-[16px] md:rounded-[20px] outline-none text-right z-10 placeholder:text-white/10"
                                />
                                
                                {/* Interactive Edit Icon indicating readiness */}
                                <div className={`absolute left-6 top-1/2 -translate-y-1/2 z-10 transition-all duration-300 pointer-events-none
                                    ${isFocused || weight ? 'opacity-100 text-white' : 'opacity-30 text-white/50 group-hover/input:opacity-60'}
                                `}>
                                    <Icon name="target" className={`w-5 h-5 ${isFocused ? 'animate-pulse' : ''} ${colorAccent}`} />
                                </div>
                            </div>
                        </div>

                    </div>
                    
                    {/* Sets Tracker Row */}
                    <div className="relative z-10 w-full px-5 md:px-8 pb-5 md:pb-8 pt-2">
                        <div className="border-t border-white/5 pt-4 flex flex-col gap-3">
                            <div className="flex justify-between items-center">
                                <span className="text-[10px] md:text-xs text-white/40 uppercase tracking-widest font-mono">Set Tracking</span>
                                <span className="text-xs font-mono text-white/60">{completedSets} / {parseInt(exercise.sets) || 1} Completed</span>
                            </div>
                            <div className="flex gap-3 overflow-x-auto hide-scrollbar pb-2 items-center">
                                {Array.from({ length: parseInt(exercise.sets) || 1 }).map((_, i) => {
                                    const isCompleted = i < completedSets;
                                    const isNext = i === completedSets;
                                    return (
                                        <button
                                            key={i}
                                            onClick={isNext ? onSetComplete : undefined}
                                            className={`w-8 h-8 md:w-10 md:h-10 shrink-0 rounded-full border flex items-center justify-center transition-all duration-300
                                                ${isCompleted ? 'bg-white text-black border-white' : 
                                                  isNext ? 'border-white/50 hover:border-white hover:bg-white/10 text-white cursor-pointer' : 
                                                  'border-white/10 text-white/20 cursor-not-allowed'}
                                            `}
                                            disabled={!isNext}
                                        >
                                            {isCompleted ? <Icon name="check" className="w-4 h-4 md:w-5 md:h-5" /> : (i + 1)}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const playBeep = () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gainNode = ctx.createGain();
                osc.connect(gainNode);
                gainNode.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gainNode.gain.setValueAtTime(0.5, ctx.currentTime);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
            } catch(e) { console.log("Audio not supported"); }
        };

        function App() {
            const [weights, setWeights] = useState({});
            const [isLoaded, setIsLoaded] = useState(false);
            const [activeDay, setActiveDay] = useState(workoutData[0].id);
            const [completedSets, setCompletedSets] = useState({});
            const [activeTimer, setActiveTimer] = useState(null);
            const [timeLeft, setTimeLeft] = useState(0);

            // Timer Effect
            useEffect(() => {
                if (!activeTimer) return;
                const interval = setInterval(() => {
                    const now = Date.now();
                    const remaining = Math.max(0, Math.ceil((activeTimer.endTime - now) / 1000));
                    setTimeLeft(remaining);
                    if (remaining === 0) {
                        clearInterval(interval);
                        setActiveTimer(null);
                        playBeep();
                    }
                }, 1000);
                return () => clearInterval(interval);
            }, [activeTimer]);

            const startTimer = (seconds) => {
                setActiveTimer({ endTime: Date.now() + seconds * 1000, duration: seconds });
                setTimeLeft(seconds);
            };

            const getTodayString = () => new Date().toDateString();

            const handleSetComplete = (dayId, exerciseIdx, numSets, restStr) => {
                const key = `${getTodayString()}_${dayId}_${exerciseIdx}`;
                const current = completedSets[key] || 0;
                
                if (current < numSets) {
                    const newCount = current + 1;
                    const newSets = { ...completedSets, [key]: newCount };
                    setCompletedSets(newSets);
                    localStorage.setItem('apex_protocol_ironman_sets', JSON.stringify(newSets));
                    
                    if (newCount === numSets) {
                        startTimer(60);
                    } else {
                        const restSeconds = parseInt(restStr) || 60;
                        startTimer(restSeconds);
                    }
                }
            };

            const resetProgress = () => {
                if (window.confirm("Reset all set progress for today? (Your saved weights will be kept)")) {
                    setCompletedSets({});
                    localStorage.removeItem('apex_protocol_ironman_sets');
                }
            };

            // Load from local storage on mount
            useEffect(() => {
                const savedWeights = localStorage.getItem('apex_protocol_ironman_weights');
                if (savedWeights) {
                    try { setWeights(JSON.parse(savedWeights)); } catch (e) { console.error(e); }
                }
                const savedSets = localStorage.getItem('apex_protocol_ironman_sets');
                if (savedSets) {
                    try { setCompletedSets(JSON.parse(savedSets)); } catch (e) { console.error(e); }
                }
                setIsLoaded(true);
            }, []);

            // Save specific weight
            const handleSaveWeight = (dayId, exerciseIndex, weightValue) => {
                const newWeights = {
                    ...weights,
                    [`${dayId}_${exerciseIndex}`]: weightValue
                };
                setWeights(newWeights);
                localStorage.setItem('apex_protocol_ironman_weights', JSON.stringify(newWeights));
            };

            if (!isLoaded) return null;

            const currentDayData = workoutData.find(d => d.id === activeDay);

            return (
                <div className="bg-[#050101] min-h-screen text-slate-200 font-sans selection:bg-iron-red-500/30 selection:text-iron-gold-200 overflow-x-hidden relative">
                    
                    {activeTimer && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] animate-fadeIn">
                            <div className="backdrop-blur-xl bg-[#050101]/90 border border-iron-cyan-500/30 shadow-[0_0_30px_rgba(6,182,212,0.2)] rounded-full px-6 py-3 flex items-center gap-6">
                                <div className="flex items-center gap-3">
                                    <Icon name="timer" className="w-5 h-5 text-iron-cyan-400 animate-pulse" />
                                    <span className="text-white font-mono text-xl md:text-2xl font-bold tracking-wider">
                                        {Math.floor(timeLeft / 60).toString().padStart(2, '0')}:{(timeLeft % 60).toString().padStart(2, '0')}
                                    </span>
                                </div>
                                <button 
                                    onClick={() => { setActiveTimer(null); setTimeLeft(0); }}
                                    className="text-[10px] uppercase tracking-widest text-iron-red-400 hover:text-iron-red-300 font-mono"
                                >
                                    Skip
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="fixed inset-0 grid-bg pointer-events-none"></div>
                    <div className="fixed inset-0 noise-bg mix-blend-screen"></div>
                    <div className="fixed inset-0 overflow-hidden pointer-events-none z-40"><div className="scanline"></div></div>

                    {/* Header Section */}
                    <section className="relative min-h-[70dvh] flex flex-col justify-center px-6 md:px-12 lg:px-24 z-10 pt-20 pb-10 overflow-hidden bg-[#050101]">
                        {/* Dynamic Ambient Background Orbs - Iron Man Colors */}
                        <div className="absolute top-0 left-0 w-full h-[50vh] bg-gradient-to-b from-iron-red-900/20 to-transparent pointer-events-none" />
                        <div className="absolute top-1/3 left-1/4 w-[40vw] h-[40vw] bg-iron-red-600/10 rounded-full blur-[120px] mix-blend-screen animate-pulse pointer-events-none" style={{ animationDuration: '6s' }} />
                        <div className="absolute bottom-1/4 right-1/4 w-[30vw] h-[30vw] bg-iron-gold-500/5 rounded-full blur-[100px] mix-blend-screen animate-pulse pointer-events-none" style={{ animationDuration: '8s', animationDelay: '2s' }} />

                        {/* Status Pill - Arc Reactor vibe */}
                        <div className="absolute top-8 left-6 md:left-12 flex items-center gap-3 backdrop-blur-xl bg-iron-cyan-950/20 px-5 py-2.5 rounded-full border border-iron-cyan-500/30 shadow-[0_0_15px_rgba(6,182,212,0.15)] z-20">
                            <div className="relative flex h-3 w-3">
                                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-iron-cyan-400 opacity-75"></span>

                        <div className="max-w-[1400px] mx-auto w-full relative z-10 mt-12">
                            <ScrollReveal delay={100}>
                                <h2 className="text-iron-gold-400 font-mono text-xs md:text-sm uppercase tracking-[0.4em] mb-8 flex items-center gap-6">
                                    <span className="w-12 md:w-24 h-[1px] bg-iron-gold-400/50 shadow-[0_0_10px_rgba(251,191,36,0.8)]"></span>
                                    Mark L Optimization
                                </h2>
                            </ScrollReveal>

                            <ScrollReveal delay={300}>
                                <h1 className="text-[14vw] md:text-[10vw] xl:text-[9rem] leading-[0.85] font-black uppercase tracking-tighter text-white mb-10 md:mb-12">
                                    Project <br/> <span className="text-transparent bg-clip-text bg-gradient-to-r from-iron-red-600 via-iron-red-500 to-iron-gold-500 drop-shadow-[0_0_20px_rgba(220,38,38,0.4)]">Apex</span>
                                </h1>
                            </ScrollReveal>
                            
                            <ScrollReveal delay={500}>
                                <div className="max-w-3xl text-white/60 text-xl md:text-2xl xl:text-3xl font-light leading-snug border-l-[3px] border-iron-gold-400/50 pl-6 md:pl-10 py-2">
                                    A scientifically optimized 5-Day Single-Muscle "Bro Split" engineered for <strong className="text-iron-gold-400 font-medium">extreme hypertrophy</strong> and systemic adaptation. 
                                </div>
                            </ScrollReveal>
                        </div>

                                <div className="lg:col-span-5">
                                    <ScrollReveal>
                                        <h3 className="text-4xl md:text-6xl xl:text-7xl font-black uppercase tracking-tighter mb-8 leading-none text-white">
                                            The <br className="hidden lg:block"/><span className="text-transparent bg-clip-text bg-gradient-to-br from-iron-gold-400 to-iron-gold-600">Method</span>
                                        </h3>
                                        <p className="text-white/60 text-lg md:text-xl leading-relaxed mb-8 font-light">
                                            High intensity, dense volume, and strict short rest periods elevate the heart rate, forcing the body into simultaneous extreme muscle adaptation and maximum fat burning.
                                        </p>
                                    </ScrollReveal>
                                </div>

                                <div className="lg:col-span-7">
                                    <ScrollReveal delay={200}>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 md:gap-8">
                                            {/* Glassmorphic Data Cards */}
                                            <div className="bg-[#110505] p-8 md:p-10 rounded-[2rem] border border-iron-red-900/30 hover:border-iron-red-500/50 transition-colors duration-500 hover:bg-[#1a0505] group relative overflow-hidden shadow-[inset_0_0_20px_rgba(220,38,38,0.05)]">
                                                <div className="absolute top-0 right-0 w-32 h-32 bg-iron-red-600/10 rounded-full blur-[40px] -translate-y-1/2 translate-x-1/2 group-hover:bg-iron-red-500/30 transition-colors duration-500" />
                                                <Icon name="crosshair" className="w-10 h-10 md:w-12 md:h-12 text-iron-gold-400 mb-8 group-hover:scale-110 transition-transform duration-500 drop-shadow-[0_0_8px_rgba(251,191,36,0.5)]" />
                                                <h4 className="text-white font-bold uppercase tracking-widest mb-4 text-sm md:text-base">Program Goal</h4>
                                                <p className="text-sm md:text-base text-white/50 leading-relaxed font-light">Extreme muscle hypertrophy combined with maximum fat loss. Full CNS activation required.</p>
                                            </div>
                                            
                                            <div className="bg-[#110505] p-8 md:p-10 rounded-[2rem] border border-iron-red-900/30 hover:border-iron-red-500/50 transition-colors duration-500 hover:bg-[#1a0505] group relative overflow-hidden md:translate-y-8 shadow-[inset_0_0_20px_rgba(220,38,38,0.05)]">

                                                <Icon name="zap" className="w-10 h-10 md:w-12 md:h-12 text-iron-red-500 mb-8 group-hover:scale-110 transition-transform duration-500 drop-shadow-[0_0_8px_rgba(220,38,38,0.5)]" />
                                                <h4 className="text-white font-bold uppercase tracking-widest mb-4 text-sm md:text-base">Execution</h4>
                                                <p className="text-sm md:text-base text-white/50 leading-relaxed font-light">High volume, short rest. 100% targeted destruction followed by a full 7-day recovery cycle.</p>
                                            </div>
                                        </div>
                                    </ScrollReveal>
                                </div>

                            </div>
                        </div>
                    </section>

                    <section className="relative z-20 bg-[#050101] min-h-screen pt-12 pb-40">
                        
                        {/* Sticky Tabs Navigation */}
                        <div className="sticky top-0 z-50 w-full backdrop-blur-xl bg-[#050101]/80 border-b border-iron-red-900/30 shadow-[0_10px_30px_rgba(0,0,0,0.8)] py-4 mb-12 md:mb-20">
                            <div className="max-w-[1400px] mx-auto px-2 sm:px-4 md:px-8 lg:px-16 xl:px-24">
                                <div className="flex flex-wrap justify-center gap-2 md:gap-4 items-center">
                                    {workoutData.map((day) => (
                                        <button
                                            key={day.id}
                                            onClick={() => setActiveDay(day.id)}
                                            className={`
                                                relative flex-grow sm:flex-grow-0 flex justify-center items-center px-3 py-2.5 sm:px-6 sm:py-3 md:px-8 md:py-4 rounded-[12px] md:rounded-[16px] font-mono text-[10px] sm:text-xs md:text-sm uppercase tracking-widest transition-all duration-300 ease-out overflow-hidden
                                                ${activeDay === day.id 
                                                    ? 'text-white shadow-[0_0_20px_rgba(220,38,38,0.4)]' 
                                                    : 'text-white/40 hover:text-iron-gold-400 bg-transparent border border-iron-red-900/30 hover:border-iron-gold-400/30 hover:bg-[#110505]'}
                                            `}
                                        >
                                            {activeDay === day.id && (
                                                <div className="absolute inset-0 bg-gradient-to-r from-iron-red-700 to-iron-red-600" />
                                            )}
                                            {activeDay === day.id && (
                                                <div className="absolute inset-0 opacity-40 bg-[linear-gradient(45deg,transparent_25%,rgba(255,255,255,0.1)_50%,transparent_75%)] bg-[length:250%_250%] animate-shimmer" />
                                            )}
                                            {activeDay === day.id && (
                                                <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 w-1/2 h-1 bg-iron-gold-400 blur-sm" />
                                            )}
                                            <span className="relative z-10 flex items-center gap-2">
                                                {activeDay === day.id && <Icon name="shield" className="w-4 h-4 text-iron-gold-400 drop-shadow-[0_0_5px_rgba(251,191,36,0.8)]" />}
                                                {day.day}
                                            </span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="max-w-[1400px] mx-auto px-4 md:px-8 lg:px-16 xl:px-24 min-h-[60vh]">
                            {/* Single Day Rendering with fade transition effect */}
                            <div key={currentDayData.id} className="animate-fadeIn">
                                
                                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8 md:mb-12 px-2 md:px-0">
                                    <div className="flex items-start gap-4 md:gap-8 relative">
                                        {/* Giant Background Number */}
                                        <span className="hidden lg:block absolute -left-12 top-0 text-[15rem] font-black text-white/[0.02] font-mono tracking-tighter leading-none -z-10 select-none pointer-events-none">
                                            {currentDayData.id}
                                        </span>
                                        
                                        <div className="w-1.5 self-stretch bg-gradient-to-b from-iron-gold-400 to-iron-red-600 rounded-full hidden md:block opacity-80 shadow-[0_0_15px_rgba(251,191,36,0.4)]"></div>
                                        
                                        <div>
                                            <h4 className={`text-xs md:text-sm font-mono uppercase tracking-[0.3em] mb-4 flex items-center gap-3 text-iron-gold-400`}>
                                                <Icon name="dumbbell" className="w-4 h-4" /> {currentDayData.day}
                                                <span className="text-white/30">— Phase {currentDayData.id}</span>
                                            </h4>
                                            <h3 className="text-4xl md:text-6xl xl:text-7xl font-black uppercase tracking-tight text-white leading-none drop-shadow-2xl">
                                                {currentDayData.title}
                                            </h3>
                                        </div>
                                    </div>
                                </div>

                                <div className="relative">
                                    <div className={`absolute inset-0 bg-gradient-to-b ${currentDayData.theme} opacity-[0.03] rounded-[40px] pointer-events-none -m-4 md:-m-8 z-0`} />
                                    
                                    <div className="relative z-10 flex flex-col w-full">
                                        {currentDayData.exercises.map((exercise, exerciseIdx) => {
                                            const weightKey = `${currentDayData.id}_${exerciseIdx}`;
                                            return (
                                                <ExerciseRow 
                                                    key={`${currentDayData.id}-${exerciseIdx}`}
                                                    dayId={currentDayData.id}
                                                    index={exerciseIdx}
                                                    exercise={exercise}
                                                    initialWeight={weights[weightKey]}
                                                    onSaveWeight={handleSaveWeight}
                                                    colorAccent={currentDayData.textAccent}
                                                    completedSets={completedSets[`${getTodayString()}_${currentDayData.id}_${exerciseIdx}`] || 0}
                                                    onSetComplete={() => handleSetComplete(currentDayData.id, exerciseIdx, parseInt(exercise.sets) || 1, exercise.rest)}
                                                />
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="border-t border-iron-red-900/30 pt-20 pb-12 text-center z-10 relative bg-[#030101]">
                        <ScrollReveal>
                            <div className="flex flex-col items-center justify-center gap-6">
                                <div className="w-12 h-12 rounded-full border border-iron-red-900/50 flex items-center justify-center bg-red-950/20 shadow-[inset_0_0_15px_rgba(220,38,38,0.1)]">
                                    <Icon name="activity" className="w-5 h-5 text-iron-gold-400" />
                                </div>
                                <h4 className="text-white/50 font-mono text-sm uppercase tracking-[0.3em]">End of Protocol</h4>
                                <p className="text-white/30 text-xs mt-2 max-w-sm mx-auto px-6 leading-relaxed">
                                    Initiate 48-hour active recovery phase. Nutrition and sleep optimization are mandatory.
                                </p>
                                <button 
                                    onClick={resetProgress}
                                    className="mt-6 px-6 py-3 rounded-full border border-iron-red-900/50 hover:bg-iron-red-900/30 text-iron-red-400 hover:text-iron-red-300 text-xs font-mono uppercase tracking-widest transition-colors duration-300 flex items-center gap-2 shadow-[0_0_15px_rgba(220,38,38,0.05)] hover:shadow-[0_0_20px_rgba(220,38,38,0.15)] cursor-pointer"
                                >
                                    <Icon name="rotateCcw" className="w-4 h-4" /> Reset Set Progress
                                </button>
                            </div>
                        </ScrollReveal>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
